# Stokku local stack — owner: Deployment (T-005).
# One command: `make up` (migrates + seeds on first start, then waits for
# healthchecks). Data persists in the pgdata volume across `make down`;
# `docker compose down -v` wipes it.
name: stokku

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stokku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: stokku
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 55443 on the host so the shared dev Postgres (55442) is never touched.
    ports:
      - "55443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stokku -d stokku"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot tool (profile "tools"): runs DB's migrations/seed inside the
  # compose network. Started explicitly by `make up`.
  migrate:
    build:
      context: .
      dockerfile: infra/migrate.Dockerfile
    profiles: ["tools"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://stokku:${POSTGRES_PASSWORD}@postgres:5432/stokku
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgres://stokku:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/stokku
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
