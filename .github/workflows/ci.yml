# Stokku CI — owner: Deployment (T-002).
# Red CI must block merge: enable branch protection on main requiring
# these checks (see infra/deploy/README.md "Branch protection").
# hashFiles() is not allowed in job-level `if` (GitHub rejects the whole
# workflow), so the web/api jobs run unconditionally — their targets are
# real code now — and only the compose image builds keep a step-level
# hashFiles guard.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck · lint · tests · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # TODO(Deployment): switch to --frozen-lockfile once the root lockfile
      # covers the fully merged workspace (it must be regenerated after the
      # first frontend merge).
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter ./apps/web run typecheck
      - name: lint (only when a lint script exists)
        run: |
          if grep -q '"lint"' apps/web/package.json; then
            pnpm --filter ./apps/web run lint
          else
            echo "apps/web has no lint script yet — typecheck is the lint gate for now"
          fi
      - run: pnpm --filter ./apps/web run test
      - run: pnpm --filter ./apps/web run build

  api:
    name: API (fmt · clippy -D warnings · DB-backed tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway per-job container, so trust auth is acceptable here
          # (the test harness connects as the passwordless non-superuser
          # role `stokku`); never configure trust on a real environment.
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # Correctness: without this the DB-backed tests (auth, moving-average,
      # ledger property test) print "SKIPPED" and the job goes green having
      # exercised nothing — a false green.
      STOKKU_TEST_ADMIN_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api
      - name: create the non-superuser app role the tests connect as
        working-directory: .
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$STOKKU_TEST_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE stokku LOGIN"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  migrations:
    name: Migrations (from zero · seed idempotent · DB verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Bootstrap superuser is "postgres", like the dev cluster and the
          # compose stack — the service must NOT make the app role a
          # superuser, or forced RLS is silently bypassed and the
          # cross-tenant proofs in verify.sql are meaningless.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: stokku
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stokku"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # Migrations run on the admin DSN (0010 auth functions need a
      # superuser) — but the SAME DATABASE as DATABASE_URL (the trap
      # docs/DEPLOY.md warns about); seed + verify run as the
      # non-superuser app role, exactly like the dev environment.
      MIGRATION_DATABASE_URL: postgres://postgres:ci@localhost:5432/stokku
      DATABASE_URL: postgres://stokku:ci@localhost:5432/stokku
    steps:
      - uses: actions/checkout@v4
      - name: Install postgres client + sqlx-cli
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          cargo install sqlx-cli --version 0.9.1 --no-default-features --features postgres
      - name: create the non-superuser app role
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE stokku LOGIN PASSWORD 'ci'"
      - run: ./scripts/migrate.sh
      - run: ./scripts/seed.sh
      - name: seed again (must insert 0 rows)
        run: ./scripts/seed.sh
      - run: ./scripts/verify.sh

  compose:
    name: Compose + Dockerfiles (config check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci
      STOKKU_DB_PASSWORD: ci
      JWT_SECRET: ci-not-a-real-secret
      APP_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config -q
      - name: build API image (only once services/api is real)
        if: ${{ hashFiles('services/api/Cargo.toml') != '' }}
        run: docker build -f infra/api.Dockerfile .
      - name: build web image (only once apps/web is real)
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: docker build -f infra/web.Dockerfile .
