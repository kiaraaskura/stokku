# Build installers on GitHub's machines.
#
# This machine cannot make a Windows .exe (no mingw-w64/NSIS) or an Android
# .apk (no Android SDK), and iOS needs macOS. GitHub's runners can do all of
# them. Run this by hand from the Actions tab ("Run workflow"), or push a tag
# like v0.1.0.
#
# Artifacts appear as downloadable files on the run page. Nothing is published
# to a store, and nothing is code-signed yet — an unsigned Windows installer
# shows a SmartScreen warning, and Android needs a keystore you create yourself.

name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  desktop-linux:
    name: Linux (.AppImage, .deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/desktop
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: stokku-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  desktop-windows:
    name: Windows (.exe installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/desktop
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: stokku-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  desktop-macos:
    name: macOS (.dmg, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/desktop
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: stokku-macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  android:
    name: Android (.apk, debug-signed)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # No android-actions/setup-android here: on current runner images its
      # sdkmanager exits 1 ("Failed to find package 'tools'"); the runners
      # already ship the SDK with accepted licenses (ANDROID_HOME is set).
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @stokku/web build
      - name: Sync into the Android project
        working-directory: apps/mobile
        run: npx cap sync android
      - name: Assemble
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stokku-android
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  web:
    name: Web (PWA bundle)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stokku/web build
      - uses: actions/upload-artifact@v4
        with:
          name: stokku-web
          path: apps/web/dist
          if-no-files-found: error