# Stokku pnpm workspace. Deployment owns this file.
# Rust code (services/api) is not a pnpm package; it builds with cargo.
packages:
  - apps/*
  - packages/*

# pnpm 12: only these dependencies may run postinstall build scripts.
# (pnpm 12 renamed this key from onlyBuiltDependencies to allowBuilds.)
# esbuild is needed by vite. Keep this list short and reviewed.
allowBuilds:
  esbuild: true
